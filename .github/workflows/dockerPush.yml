name: Deploy Bible Reference API

# Easypanel builds and deploys the app itself; this only tells it a new commit is on master.
on:
  push:
    branches:
      - master

jobs:
  deploy_easypanel:
    name: Trigger Easypanel deploy
    runs-on: ubuntu-latest
    steps:
      # The trigger URL carries a secret token, so it lives in the EASYPANEL_DEPLOY_URL repository secret
      # (Easypanel: the app's Deploy tab, "Deployment Trigger URL"). Runs on every push or merge to master.
      - name: Ask Easypanel to deploy
        env:
          EASYPANEL_DEPLOY_URL: ${{ secrets.EASYPANEL_DEPLOY_URL }}
        run: |
          test -n "$EASYPANEL_DEPLOY_URL" || { echo "Set the EASYPANEL_DEPLOY_URL repository secret."; exit 1; }
          curl --fail-with-body --silent --show-error --max-time 30 -X POST "$EASYPANEL_DEPLOY_URL"
