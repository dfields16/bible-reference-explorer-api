spring:
  neo4j:
    uri: neo4j://neo4j:7687
    authentication:
      username: neo4j
      password: ${NEO4J_PASSWORD:}

bibleApi:
  token:
  baseUrl: https://api.scripture.api.bible/v1/

springdoc:
  swagger-ui:
    path: /swagger.html

server:
  servlet:
    context-path: /api

cache:
  clearCron: 0 0 */4 * * *